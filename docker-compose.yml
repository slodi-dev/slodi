services:
  # ── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: slodi-postgres
    env_file:
      - ./backend/.env.docker
    environment:
      POSTGRES_DB: slodi_db
      POSTGRES_USER: slodi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slodi_password}
    # Published on loopback only. Docker writes its own iptables rules, so a
    # port bound to 0.0.0.0 is open to the internet whatever ufw says; on the
    # VM nginx is the only thing that should reach these. Set BIND_ADDRESS=0.0.0.0
    # to reach them from another device on your network in development.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slodi-network

  # ── Migrations (run-once) ─────────────────────────────────
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: slodi-migrations
    env_file:
      - ./backend/.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SEED_OUTPUT_DIR: /app/seed_data
      UV_NO_SYNC: "true"
    volumes:
      - seed_data:/app/seed_data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔄 Running database migrations...' &&
        uv run alembic upgrade head &&
        echo '✅ Migrations complete!' &&
        echo '🌱 Running seed...' &&
        PYTHONPATH=. uv run python scripts/seed.py &&
        echo '✅ Seed complete!'
      "
    networks:
      - slodi-network
    restart: "no"

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: slodi-backend
    env_file:
      - ./backend/.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SEED_OUTPUT_DIR: /app/seed_data
      UV_NO_SYNC: "true"
      # nginx reaches the container through the Docker bridge gateway, which
      # uvicorn does not trust by default (only 127.0.0.1). Untrusted, it ignores
      # X-Forwarded-For and every visitor gets the gateway's IP, so the
      # IP rate limiter put everyone in one bucket. Trust the Docker range only:
      # uvicorn then takes the rightmost untrusted address, the one nginx
      # appended, not anything the client wrote into the header. Never "*",
      # which makes uvicorn take the leftmost, client-supplied, address.
      FORWARDED_ALLOW_IPS: "127.0.0.1,172.16.0.0/12"
    volumes:
      - seed_data:/app/seed_data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - slodi-network
    restart: unless-stopped

  # ── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # NEXT_PUBLIC_API_URL is baked into the client bundle at build time.
        # Must be reachable from the browser — set this in your .env file on each machine
        # (https://api.slodi.is in production, http://localhost:8000 locally). No default:
        # a silent localhost fallback on a public site makes Chrome prompt visitors for
        # local-network access.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env (see .env.example)}
    container_name: slodi-frontend
    env_file:
      - ./frontend/.env.docker
    environment:
      SEED_OUTPUT_DIR: /app/seed_data
    volumes:
      - seed_data:/app/seed_data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - slodi-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  seed_data:
    driver: local

networks:
  slodi-network:
    driver: bridge
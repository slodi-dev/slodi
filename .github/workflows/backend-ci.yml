name: Backend CI
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app
        env:
          # Required by Pydantic Settings at import time — dummy values are fine here
          ENV: ci
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          DB_PORT: "5432"
          AUTH0_DOMAIN: ci.auth0.com
          AUTH0_AUDIENCE: ci
          AZURE_STORAGE_ACCOUNT: ci
          AZURE_STORAGE_KEY: Y2k=
          AZURE_STORAGE_CONTAINER_IMAGES: images
          AZURE_STORAGE_CONTAINER_DOCUMENTS: documents
      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Lint & Type Check — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv sync --locked --group dev

      - name: Run unit tests
        run: PYTHONPATH=. uv run pytest -q -m "not integration"
        env:
          # Required by Pydantic Settings at import time — dummy values are fine here
          ENV: ci
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          DB_PORT: "5432"
          AUTH0_DOMAIN: ci.auth0.com
          AUTH0_AUDIENCE: ci
          AZURE_STORAGE_ACCOUNT: ci
          AZURE_STORAGE_KEY: Y2k=
          AZURE_STORAGE_CONTAINER_IMAGES: images
          AZURE_STORAGE_CONTAINER_DOCUMENTS: documents

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Unit Tests — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: ci
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      AUTH0_DOMAIN: ci.auth0.com
      AUTH0_AUDIENCE: ci
      AZURE_STORAGE_ACCOUNT: ci
      AZURE_STORAGE_KEY: Y2k=
      AZURE_STORAGE_CONTAINER_IMAGES: images
      AZURE_STORAGE_CONTAINER_DOCUMENTS: documents
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv sync --locked --group dev

      - name: Upgrade an empty database to head
        run: uv run alembic upgrade head

      - name: Models match the migrated schema
        # Fails when a model and the migrations disagree, e.g. an index created
        # in a migration but not declared on the model, which the next
        # autogenerated migration would otherwise propose to drop.
        run: uv run alembic check

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Migrations — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

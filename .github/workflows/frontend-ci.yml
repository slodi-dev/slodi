name: Frontend CI
on:
  # Re-run on main by hand, e.g. to redeploy without a code change.
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      # A green run here is what deploys (deploy-frontend.yml), so anything
      # that changes what gets deployed must trigger it too.
      - ".github/workflows/deploy-frontend.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/deploy-frontend.yml"
      - "docker-compose.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Unwrapped, undefined and hard-coded colour tokens. Errors fail; warnings
      # (legacy tokens, literal rgba) are printed but do not.
      - name: Design tokens
        run: npm run check:tokens

      - name: Every component has stories
        run: npm run check:stories

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          AUTH0_SECRET: ci_secret_placeholder_32_characters_x
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://placeholder.auth0.com
          AUTH0_CLIENT_ID: ci_client_id
          AUTH0_CLIENT_SECRET: ci_client_secret

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Lint & Build — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

  # Every Storybook story rendered in real Chromium in four forms (light/dark ×
  # phone/desktop). Fails on render errors, failing play functions, console.error
  # and, where enabled, axe violations. Design: docs/ui-quality-pipeline.md.
  storybook-tests:
    name: Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Stories as tests (4 forms)
        run: npm run test:stories

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Storybook tests — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

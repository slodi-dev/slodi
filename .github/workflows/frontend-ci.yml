name: Frontend CI
on:
  # Re-run on main by hand, e.g. to redeploy without a code change.
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      # A green run here is what deploys (deploy-frontend.yml), so anything
      # that changes what gets deployed must trigger it too.
      - ".github/workflows/deploy-frontend.yml"
      - "docker-compose.yml"
  # No path filter on pull requests: these jobs are required checks on main,
  # and a required check whose workflow never starts blocks the PR forever.
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Unwrapped, undefined and hard-coded colour tokens. Errors fail; warnings
      # (legacy tokens, literal rgba) are printed but do not.
      - name: Design tokens
        run: npm run check:tokens

      - name: Every component has stories
        run: npm run check:stories

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          AUTH0_SECRET: ci_secret_placeholder_32_characters_x
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://placeholder.auth0.com
          AUTH0_CLIENT_ID: ci_client_id
          AUTH0_CLIENT_SECRET: ci_client_secret

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Lint & Build — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

  # Every Storybook story rendered in real Chromium in six forms (light / dark /
  # patrol accent × phone/desktop), one theme per matrix job so the themes run in
  # parallel. Fails on render errors, failing play functions, console.error and,
  # where enabled, axe violations. Design: docs/ui-quality-pipeline.md.
  storybook-tests-theme:
    name: Storybook tests (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark, patrol]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Stories as tests (${{ matrix.theme }}, phone + desktop)
        run: npm run test:stories
        env:
          STORYBOOK_THEMES: ${{ matrix.theme }}

  # The required check. Branch protection names "Storybook tests", so the matrix
  # reports through this one job: green only if every theme passed.
  storybook-tests:
    name: Storybook tests
    needs: storybook-tests-theme
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every theme passed
        run: |
          echo "Matrix result: ${{ needs.storybook-tests-theme.result }}"
          test "${{ needs.storybook-tests-theme.result }}" = "success"

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Storybook tests — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"

  # A screenshot of every story (light theme, desktop width) compared with the
  # baselines in frontend/visual/__screenshots__/. Runs in the official
  # Playwright image so font rendering matches the baselines, which are made in
  # the same image (`npm run test:visual:update`). On a difference, the
  # expected/actual/diff PNGs are uploaded as the "visual-diff" artifact.
  # Design: docs/ui-quality-pipeline.md, layer 2.
  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Must match the installed Playwright (checked below).
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Playwright matches the image
        run: |
          installed="$(node -p 'require("@playwright/test/package.json").version')"
          if [ "$installed" != "1.64.0" ]; then
            echo "::error::Playwright $installed is installed but the job runs the v1.64.0 image. Update the image tag here and regenerate the baselines (npm run test:visual:update)."
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Screenshots of every story
        run: npx playwright test -c playwright.visual.config.ts

      - name: Summary of changed stories
        if: failure()
        run: |
          {
            echo "### Visual regression: stories that look different"
            echo
            find visual-results/artifacts -name '*-diff.png' -printf '- %f\n' | sed 's/-diff\.png$//' | sort
            echo
            echo "Download the **visual-diff** artifact for expected / actual / diff images."
            echo "If the change is intended, run \`npm run test:visual:update\` in \`frontend/\` and commit the new baselines."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: frontend/visual-results/
          retention-days: 14

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Visual regression — ${{ github.repository }}"
          description: "Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`"
